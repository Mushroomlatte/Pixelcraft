<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art 24x24 Converter & Parts List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-top: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background-color: #2980b9;
        }
        #canvas-container {
            margin-top: 20px;
            display: inline-block;
            border: 4px solid #2c3e50;
            border-radius: 4px;
            background: #fff;
            line-height: 0;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 360px;
            height: 360px;
            display: block;
        }
        .actions {
            margin-top: 15px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #parts-list {
            text-align: left;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }
        .part-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .color-preview-box {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            border: 1px solid #ccc;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>24x24 Pixel Art Converter</h1>
    <p class="subtitle">Upload any image to generate a solid-color 24x24 grid with a precise parts count.</p>

    <div class="card">
        <label for="imageUpload" class="upload-btn">Choose Image</label>
        <input type="file" id="imageUpload" accept="image/*">
        
        <div id="canvas-container" style="display: none;">
            <canvas id="pixelCanvas" width="24" height="24"></canvas>
        </div>

        <div class="actions">
            <button id="downloadBtn" class="btn" disabled>Download 24x24 Image</button>
        </div>
    </div>

    <div class="card" id="parts-card" style="display: none;">
        <h3>Pixel Count Breakdown</h3>
        <p style="font-size: 13px; color: #666; margin-top:0;">Number of pixels needed per color code:</p>
        <div id="parts-list"></div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');
        const downloadBtn = document.getElementById('downloadBtn');
        const partsCard = document.getElementById('parts-card');
        const partsList = document.getElementById('parts-list');

        // Helper to convert RGB to Hex
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Clear and draw 24x24 downsampled image
                    ctx.clearRect(0, 0, 24, 24);
                    ctx.drawImage(img, 0, 0, 24, 24);

                    // Process pixels and count occurrences
                    const imgData = ctx.getImageData(0, 0, 24, 24);
                    const data = imgData.data;
                    const colorCounts = {};

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        // Skip transparent pixels or treat fully transparent as white/background if desired
                        if (a < 128) continue;

                        const hex = rgbToHex(r, g, b).toUpperCase();
                        colorCounts[hex] = (colorCounts[hex] || 0) + 1;
                    }

                    // Render parts list sorted by count (highest first)
                    partsList.innerHTML = '';
                    const sortedColors = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]);

                    sortedColors.forEach(([hex, count]) => {
                        const item = document.createElement('div');
                        item.className = 'part-item';
                        item.innerHTML = `
                            <div>
                                <span class="color-preview-box" style="background-color: ${hex};"></span>
                                <strong>Code / Color:</strong> ${hex}
                            </div>
                            <div><strong>${count}</strong> pixels</div>
                        `;
                        partsList.appendChild(item);
                    });

                    canvasContainer.style.display = 'block';
                    partsCard.style.display = 'block';
                    downloadBtn.disabled = false;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'pixel-art-24x24.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
